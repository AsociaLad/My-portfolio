<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Imad El Hyani | Full-Stack Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Imad El Hyani - Full-Stack Engineer & Engineering Student at EMSI Casablanca. Specialized in Java, Spring Boot, Angular, and Cloud Technologies.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- SF Pro-like fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: 'rgb(var(--color-primary) / <alpha-value>)',
              light: 'rgb(var(--color-primary-light) / <alpha-value>)'
            },
            accent: {
              DEFAULT: 'rgb(var(--color-accent) / <alpha-value>)',
              secondary: 'rgb(var(--color-accent-secondary) / <alpha-value>)'
            },
            surface: {
              DEFAULT: 'rgb(var(--color-surface) / <alpha-value>)',
              elevated: 'rgb(var(--color-surface-elevated) / <alpha-value>)'
            },
            text: {
              primary: 'rgb(var(--color-text-primary) / <alpha-value>)',
              secondary: 'rgb(var(--color-text-secondary) / <alpha-value>)',
              tertiary: 'rgb(var(--color-text-tertiary) / <alpha-value>)'
            }
          },
          fontFamily: {
            sans: ['Inter', 'SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'gradient': 'gradient 8s ease infinite',
            'shimmer': 'shimmer 2s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' }
            },
            gradient: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' }
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' }
            }
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'gradient-conic': 'conic-gradient(from 180deg at 50% 50%, var(--tw-gradient-stops))',
            'noise': "url('data:image/svg+xml,%3Csvg viewBox=\"0 0 256 256\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cfilter id=\"noise\"%3E%3CfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.8\" numOctaves=\"4\" /%3E%3C/filter%3E%3Crect width=\"100%25\" height=\"100%25\" filter=\"url(%23noise)\" opacity=\"0.03\"/%3E%3C/svg%3E')"
          }
        }
      }
    }
  </script>
  
  <style>
    /* CSS Variables for theming */
    :root {
      /* Dark theme (default) */
      --color-primary: 0 0 0;
      --color-primary-light: 17 17 17;
      --color-accent: 99 102 241;
      --color-accent-secondary: 139 92 246;
      --color-surface: 17 17 17;
      --color-surface-elevated: 28 28 30;
      --color-text-primary: 255 255 255;
      --color-text-secondary: 174 174 178;
      --color-text-tertiary: 99 99 102;
    }

    [data-theme="light"] {
      --color-primary: 255 255 255;
      --color-primary-light: 249 250 251;
      --color-accent: 99 102 241;
      --color-accent-secondary: 139 92 246;
      --color-surface: 249 250 251;
      --color-surface-elevated: 255 255 255;
      --color-text-primary: 0 0 0;
      --color-text-secondary: 99 99 102;
      --color-text-tertiary: 174 174 178;
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    /* Hide scrollbar but keep functionality */
    body {
      overflow-x: hidden;
    }
    
    body::-webkit-scrollbar {
      width: 8px;
    }
    
    body::-webkit-scrollbar-track {
      background: transparent;
    }
    
    body::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 4px;
    }
    
    body::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.5);
    }

    /* Selection color */
    ::selection {
      background: rgba(99, 102, 241, 0.3);
      color: inherit;
    }

    /* Gradient text utility */
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 8s ease infinite;
    }

    /* Glass morphism */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] .glass {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    /* Glow effects */
    .glow {
      box-shadow: 0 0 60px rgba(99, 102, 241, 0.3);
    }

    .glow-text {
      text-shadow: 0 0 40px rgba(99, 102, 241, 0.5);
    }

    /* Card hover effect */
    .card-hover {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.25);
    }

    /* Noise texture overlay */
    .noise::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" /%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.03"/%3E%3C/svg%3E');
      pointer-events: none;
      z-index: 1;
    }

    /* Animated gradient border */
    .gradient-border {
      position: relative;
      background: linear-gradient(rgb(var(--color-surface)), rgb(var(--color-surface))) padding-box,
                  linear-gradient(135deg, #667eea, #764ba2, #f093fb) border-box;
      border: 2px solid transparent;
    }

    /* Magnetic button effect */
    .magnetic {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Tech logo styles */
    .tech-logo {
      filter: grayscale(100%);
      opacity: 0.6;
      transition: all 0.3s ease;
    }
    
    .tech-logo:hover {
      filter: grayscale(0%);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-primary text-text-primary font-sans antialiased">
  <app-root></app-root>
</body>
</html>
